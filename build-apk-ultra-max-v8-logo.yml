name: Gerar APK Android Ultra Max v8 Logo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Preparar projeto
        run: |
          echo '' | base64 -d > projeto.zip
          unzip -q projeto.zip
      - name: Gerar APK
        working-directory: GeradorTesteIPTV-Ultra
        run: gradle :app:assembleDebug --stacktrace
      - name: Preparar APK
        run: cp GeradorTesteIPTV-Ultra/app/build/outputs/apk/debug/app-debug.apk Bigger-Gerador-Testes-Ultra-Max-v8.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Bigger-Gerador-Testes-Ultra-Max-v8-APK
          path: Bigger-Gerador-Testes-Ultra-Max-v8.apk
