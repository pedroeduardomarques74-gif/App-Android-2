name: Gerar APK Leve v39 Resposta Formatada Corrigida

on:
  workflow_dispatch:
    inputs:
      config_gzip_base64:
        description: 'Configuracao compactada embutida (uso automatico pelo app)'
        required: false
        default: ''
      config_base64:
        description: 'Configuracao antiga sem compactacao (compatibilidade)'
        required: false
        default: ''
      build_id:
        description: 'ID do APK configurado'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Criar projeto v39
        shell: bash
        run: |
          printf '%s' '' | base64 -d > projeto.zip
          unzip -q projeto.zip
          cp -a GeradorTesteIPTV-Ultra/. .

      - name: Embutir configuracao compactada no APK
        if: ${{ inputs.config_gzip_base64 != '' }}
        shell: bash
        env:
          CONFIG_GZIP_B64: ${{ inputs.config_gzip_base64 }}
        run: |
          mkdir -p app/src/main/assets
          printf '%s' "$CONFIG_GZIP_B64" | base64 -d | gzip -dc > app/src/main/assets/default_config.json

      - name: Embutir configuracao antiga no APK
        if: ${{ inputs.config_gzip_base64 == '' && inputs.config_base64 != '' }}
        shell: bash
        env:
          CONFIG_B64: ${{ inputs.config_base64 }}
        run: |
          mkdir -p app/src/main/assets
          printf '%s' "$CONFIG_B64" | base64 -d > app/src/main/assets/default_config.json

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar APK base
        if: ${{ inputs.config_gzip_base64 == '' && inputs.config_base64 == '' }}
        run: cp app/build/outputs/apk/debug/app-debug.apk Bigger-Gerador-Testes-Leve-v39-Resposta-Formatada-Corrigida.apk

      - name: Disponibilizar APK base
        if: ${{ inputs.config_gzip_base64 == '' && inputs.config_base64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Bigger-Gerador-Testes-Leve-v39-Resposta-Formatada-Corrigida-APK
          path: Bigger-Gerador-Testes-Leve-v39-Resposta-Formatada-Corrigida.apk

      - name: Preparar APK configurado
        if: ${{ inputs.config_gzip_base64 != '' || inputs.config_base64 != '' }}
        run: cp app/build/outputs/apk/debug/app-debug.apk Bigger-Gerador-Testes-Configurado-${{ inputs.build_id }}.apk

      - name: Criar link publico do APK configurado
        if: ${{ inputs.config_gzip_base64 != '' || inputs.config_base64 != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: configurado-${{ inputs.build_id }}
          name: APK Configurado ${{ inputs.build_id }}
          files: Bigger-Gerador-Testes-Configurado-${{ inputs.build_id }}.apk
