name: Gerar APK Android Ultra Pro v6 Data BR

on:
  workflow_dispatch:
  push:
    branches: [ "principal" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Criar projeto v6
        shell: bash
        run: |
          echo '' | base64 -d > projeto.zip
          rm -rf app settings.gradle build.gradle GeradorTesteIPTV-Ultra
          unzip -q projeto.zip
          cp -a GeradorTesteIPTV-Ultra/. .
      - name: Compilar APK v6
        run: gradle :app:assembleDebug --stacktrace
      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Bigger-Gerador-Testes-Ultra-Pro-v6-DataBR.apk
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Bigger-Gerador-Testes-Ultra-Pro-v6-DataBR-APK
          path: Bigger-Gerador-Testes-Ultra-Pro-v6-DataBR.apk
