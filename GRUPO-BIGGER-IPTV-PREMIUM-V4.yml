      - name: Verificar estrutura Android
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/grupo-bigger-iptv-v2"
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          echo "Estrutura Android OK"

      - name: Compilar APK Debug
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/grupo-bigger-iptv-v2"
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Preparar APK
        shell: bash
        run: |
          APK="$GITHUB_WORKSPACE/grupo-bigger-iptv-v2/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Grupo-Bigger-IPTV-v2.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Grupo-Bigger-IPTV-v2-APK
          path: Grupo-Bigger-IPTV-v2.apk
          if-no-files-found: error
          retention-days: 30
