name: Gerar APK - Bigger Catalogo V13 Premium

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Criar projeto Android
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/bigger/catalogo
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BiggerCatalogo"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.bigger.catalogo'
              compileSdk 35

              defaultConfig {
                  applicationId "com.bigger.catalogo"
                  minSdk 23
                  targetSdk 35
                  versionCode 13
                  versionName "13.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme"
                  android:label="Bigger Catálogo M3U">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0D1117</item>
                  <item name="android:navigationBarColor">#0D1117</item>
                  <item name="android:colorAccent">#4DA3FF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/bigger/catalogo/MainActivity.java <<'EOF'
          package com.bigger.catalogo;

          import android.app.*;
          import android.os.*;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.text.*;
          import android.view.*;
          import android.view.inputmethod.InputMethodManager;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.widget.*;
          import java.io.*;
          import java.net.*;
          import java.nio.charset.StandardCharsets;
          import java.util.*;
          import java.util.regex.*;
          import java.util.concurrent.atomic.AtomicInteger;
          import java.security.MessageDigest;

          public class MainActivity extends Activity {

              static class SavedServer {
                  String name, url;
                  SavedServer(String n, String u) {
                      name = n;
                      url = u;
                  }
              }

              static class SeriesGroup {
                  String title;
                  ArrayList<Item> episodes = new ArrayList<>();
                  TreeMap<Integer, ArrayList<Item>> seasons = new TreeMap<>();
                  SeriesGroup(String t) { title = t; }
              }

              static class Item {
                  String name, group, url, type, status = "NÃO TESTADO";
                  String searchKey;

                  Item(String n, String g, String u, String t) {
                      name = n;
                      group = g;
                      url = u;
                      type = t;
                      searchKey = (n + " " + g + " " + t).toLowerCase(Locale.ROOT);
                  }
              }

              final ArrayList<Item> all = new ArrayList<>();
              final ArrayList<Item> shown = new ArrayList<>();
              final ArrayList<SeriesGroup> shownSeries = new ArrayList<>();
              String activeFilter = "TOTAL";
              ArrayAdapter<String> adapter;

              ListView list;
              EditText serverNameBox, urlBox, searchBox;
              TextView totalView, channelView, movieView, seriesView, infoView, activeServerView;
              Button addServerButton, seeAllServersButton, deleteAllServersButton;
              LinearLayout savedServersBox;
              SharedPreferences prefs;
              String selectedServerUrl = "";

              final Handler ui = new Handler(Looper.getMainLooper());
              Runnable pendingSearch;
              final AtomicInteger searchVersion = new AtomicInteger(0);
              final int MAX_RESULTS = 300;

              int bg = Color.rgb(13,17,23);
              int panel = Color.rgb(22,27,34);
              int text = Color.WHITE;
              int muted = Color.rgb(160,170,180);

              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(16), dp(34), dp(16), dp(8));
                  root.setBackgroundColor(bg);
                  prefs = getSharedPreferences("bigger_servers", MODE_PRIVATE);

                  TextView title = tv("BIGGER CATÁLOGO", 24, true);
                  root.addView(title);

                  TextView sub = tv("Consulta rápida de canais, filmes e séries", 13, false);
                  sub.setTextColor(muted);
                  root.addView(sub, lp(-1, -2, 0, 2, 0, 10));

                  LinearLayout activeBox = new LinearLayout(this);
                  activeBox.setOrientation(LinearLayout.HORIZONTAL);
                  activeBox.setGravity(Gravity.CENTER_VERTICAL);
                  activeBox.setPadding(dp(12), dp(8), dp(12), dp(8));
                  activeBox.setBackground(round(Color.rgb(18,24,32), dp(12)));

                  View activeDot = new View(this);
                  activeDot.setBackground(round(Color.rgb(35,205,95), dp(6)));
                  LinearLayout.LayoutParams dotParams = new LinearLayout.LayoutParams(dp(10), dp(10));
                  dotParams.setMargins(0,0,dp(8),0);
                  activeBox.addView(activeDot, dotParams);

                  activeServerView = tv("Nenhum servidor ativo", 13, true);
                  activeServerView.setTextColor(Color.rgb(205,215,225));
                  activeBox.addView(activeServerView, new LinearLayout.LayoutParams(0, dp(30), 1f));

                  root.addView(activeBox, lp(-1, dp(46), 0, 0, 0, 8));

                  addServerButton = button("+ ADICIONAR SERVIDOR");
                  root.addView(addServerButton, lp(-1, dp(44), 0, 0, 0, 10));

                  TextView savedTitle = tv("Servidores", 15, true);
                  root.addView(savedTitle, lp(-1,-2,0,0,0,5));

                  savedServersBox = new LinearLayout(this);
                  savedServersBox.setOrientation(LinearLayout.VERTICAL);
                  root.addView(savedServersBox, lp(-1,-2,0,0,0,5));

                  seeAllServersButton = button("VER TODOS");
                  root.addView(seeAllServersButton, lp(-1, dp(42), 0, 0, 0, 6));

                  deleteAllServersButton = button("GERENCIAR / APAGAR");
                  root.addView(deleteAllServersButton, lp(-1, dp(38), 0, 0, 0, 8));

                  LinearLayout cards = new LinearLayout(this);
                  cards.setOrientation(LinearLayout.HORIZONTAL);
                  totalView = card(cards, "TOTAL");
                  channelView = card(cards, "CANAIS");
                  movieView = card(cards, "FILMES");
                  seriesView = card(cards, "SÉRIES");
                  root.addView(cards, lp(-1, dp(64), 0, 0, 0, 8));

                  searchBox = edit("Pesquisar conteúdo...");
                  searchBox.setEnabled(false);
                  root.addView(searchBox, lp(-1, dp(44), 0, 0, 0, 6));

                  infoView = tv("Cole o link da lista e toque em CARREGAR CATÁLOGO.", 13, false);
                  infoView.setTextColor(muted);
                  root.addView(infoView, lp(-1, -2, 0, 4, 0, 6));

                  list = new ListView(this);
                  list.setDividerHeight(dp(1));
                  list.setBackgroundColor(bg);
                  list.setFastScrollEnabled(true);
                  list.setVerticalScrollBarEnabled(true);
                  list.setNestedScrollingEnabled(true);

                  adapter = new ArrayAdapter<String>(this, android.R.layout.simple_list_item_1, new ArrayList<String>()) {
                      @Override
                      public View getView(int position, View convertView, ViewGroup parent) {
                          TextView v = (TextView) super.getView(position, convertView, parent);
                          v.setTextColor(Color.WHITE);
                          v.setTextSize(15);
                          v.setPadding(dp(12), dp(11), dp(12), dp(11));
                          v.setMinHeight(dp(62));
                          return v;
                      }
                  };
                  list.setAdapter(adapter);

                  LinearLayout.LayoutParams listParams = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      0,
                      1f
                  );
                  root.addView(list, listParams);

                  setContentView(root);

                  addServerButton.setOnClickListener(v -> showAddServerDialog());
                  seeAllServersButton.setOnClickListener(v -> showAllServers());
                  deleteAllServersButton.setOnClickListener(v -> showManageServers());
                  renderSavedServers();

                  searchBox.addTextChangedListener(new TextWatcher() {
                      public void beforeTextChanged(CharSequence s, int st, int c, int a) {}
                      public void onTextChanged(CharSequence s, int st, int b, int c) {
                          scheduleSearch(s.toString());
                      }
                      public void afterTextChanged(Editable e) {}
                  });

                  searchBox.setOnEditorActionListener((v, actionId, event) -> {
                      hideKeyboard();
                      return false;
                  });

                  list.setOnItemClickListener((p, v, pos, id) -> {
                      if (activeFilter.equals("SÉRIES")) {
                          if (pos < shownSeries.size()) showSeriesDialog(shownSeries.get(pos));
                      } else {
                          if (pos < shown.size()) showItemDialog(shown.get(pos));
                      }
                  });
              }

              ArrayList<SavedServer> getSavedServers() {
                  ArrayList<SavedServer> list = new ArrayList<>();
                  int count = prefs.getInt("count", 0);
                  for (int i = 0; i < count; i++) {
                      String name = prefs.getString("name_" + i, "");
                      String url = prefs.getString("url_" + i, "");
                      if (!url.isEmpty()) {
                          list.add(new SavedServer(name.isEmpty() ? "Servidor " + (i + 1) : name, url));
                      }
                  }
                  return list;
              }

              void persistServers(ArrayList<SavedServer> servers) {
                  SharedPreferences.Editor e = prefs.edit().clear();
                  e.putInt("count", servers.size());
                  for (int i = 0; i < servers.size(); i++) {
                      e.putString("name_" + i, servers.get(i).name);
                      e.putString("url_" + i, servers.get(i).url);
                  }
                  e.apply();
              }

              void showAddServerDialog() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(18), dp(12), dp(18), dp(4));

                  EditText nameInput = edit("Nome do servidor");
                  EditText urlInput = edit("Link M3U / M3U8");

                  box.addView(nameInput, lp(-1, dp(48), 0, 0, 0, 8));
                  box.addView(urlInput, lp(-1, dp(48), 0, 0, 0, 4));

                  AlertDialog dlg = new AlertDialog.Builder(this)
                      .setTitle("Adicionar servidor")
                      .setView(box)
                      .setNegativeButton("CANCELAR", null)
                      .setPositiveButton("SALVAR", null)
                      .create();

                  dlg.setOnShowListener(x -> {
                      dlg.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener(v -> {
                          String name = nameInput.getText().toString().trim();
                          String url = urlInput.getText().toString().trim();

                          if (name.isEmpty()) {
                              toast("Digite o nome do servidor.");
                              return;
                          }

                          if (!(url.startsWith("http://") || url.startsWith("https://"))) {
                              toast("Cole um link M3U válido.");
                              return;
                          }

                          saveServerData(name, url);
                          dlg.dismiss();
                      });
                  });

                  dlg.show();
              }

              void saveServerData(String name, String url) {
                  ArrayList<SavedServer> servers = getSavedServers();

                  for (SavedServer s : servers) {
                      if (s.url.equals(url)) {
                          s.name = name;
                          selectedServerUrl = url;
                          persistServers(servers);
                          renderSavedServers();
                          updateActiveServerLabel(name);
                          toast("Servidor atualizado.");
                          return;
                      }
                  }

                  servers.add(0, new SavedServer(name, url));
                  selectedServerUrl = url;
                  persistServers(servers);
                  renderSavedServers();
                  updateActiveServerLabel(name);
                  toast("Servidor salvo.");
              }

              void updateActiveServerLabel(String name) {
                  if (activeServerView == null) return;
                  if (name == null || name.trim().isEmpty()) {
                      activeServerView.setText("Nenhum servidor ativo");
                  } else {
                      activeServerView.setText("ATIVO • " + name);
                  }
              }

              void saveCurrentServer() {
                  String name = serverNameBox == null ? "" : serverNameBox.getText().toString().trim();
                  String url = urlBox == null ? "" : urlBox.getText().toString().trim();
                  if (!name.isEmpty() && !url.isEmpty()) saveServerData(name, url);
              }

              void renderSavedServers() {
                  savedServersBox.removeAllViews();
                  ArrayList<SavedServer> servers = getSavedServers();

                  if (servers.isEmpty()) {
                      TextView empty = tv("Nenhum servidor salvo.", 13, false);
                      empty.setTextColor(muted);
                      savedServersBox.addView(empty, lp(-1,-2,0,3,0,5));
                      seeAllServersButton.setVisibility(View.GONE);
                      updateActiveServerLabel("");
                      return;
                  }

                  seeAllServersButton.setVisibility(servers.size() > 3 ? View.VISIBLE : View.GONE);

                  int limit = Math.min(3, servers.size());
                  for (int i = 0; i < limit; i++) {
                      addCompactServerRow(savedServersBox, servers.get(i));
                  }
              }

              void addCompactServerRow(LinearLayout parent, SavedServer s) {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.setPadding(dp(10), dp(6), dp(8), dp(6));
                  row.setBackground(round(Color.rgb(18,24,32), dp(12)));

                  View indicator = new View(this);
                  indicator.setBackgroundColor(
                      s.url.equals(selectedServerUrl) ? Color.rgb(35,205,95) : Color.TRANSPARENT
                  );
                  row.addView(indicator, new LinearLayout.LayoutParams(dp(4), dp(38)));

                  LinearLayout texts = new LinearLayout(this);
                  texts.setOrientation(LinearLayout.VERTICAL);
                  texts.setPadding(dp(10), 0, dp(6), 0);

                  TextView name = tv(s.name, 15, true);
                  texts.addView(name);

                  TextView state = tv(
                      s.url.equals(selectedServerUrl) ? "Servidor ativo" : "Toque para abrir",
                      11,
                      false
                  );
                  state.setTextColor(
                      s.url.equals(selectedServerUrl)
                          ? Color.rgb(75,220,120)
                          : muted
                  );
                  texts.addView(state);

                  row.addView(texts, new LinearLayout.LayoutParams(0, dp(46), 1f));

                  TextView menu = tv("⋮", 25, true);
                  menu.setGravity(Gravity.CENTER);
                  menu.setTextColor(Color.rgb(190,200,210));
                  row.addView(menu, new LinearLayout.LayoutParams(dp(42), dp(46)));

                  row.setOnClickListener(v -> {
                      selectedServerUrl = s.url;
                      updateActiveServerLabel(s.name);
                      renderSavedServers();
                      loadServerBySaved(s, false);
                  });

                  menu.setOnClickListener(v -> showServerActions(s));

                  parent.addView(row, lp(-1, dp(58), 0, 3, 0, 4));
              }

              void showServerActions(SavedServer s) {
                  String[] options = new String[]{
                      "Carregar catálogo",
                      "Atualizar catálogo",
                      "Limpar catálogo",
                      "Excluir servidor"
                  };

                  new AlertDialog.Builder(this)
                      .setTitle(s.name)
                      .setItems(options, (d, which) -> {
                          if (which == 0) {
                              selectedServerUrl = s.url;
                              updateActiveServerLabel(s.name);
                              renderSavedServers();
                              loadServerBySaved(s, false);
                          } else if (which == 1) {
                              selectedServerUrl = s.url;
                              updateActiveServerLabel(s.name);
                              renderSavedServers();
                              loadServerBySaved(s, true);
                          } else if (which == 2) {
                              confirmClearSavedServer(s);
                          } else {
                              confirmDeleteServer(s);
                          }
                      })
                      .setNegativeButton("FECHAR", null)
                      .show();
              }

              void addServerCard(LinearLayout parent, SavedServer s, boolean compact) {
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setPadding(dp(10), dp(8), dp(10), dp(8));
                  card.setBackground(round(panel, dp(12)));

                  LinearLayout top = new LinearLayout(this);
                  top.setOrientation(LinearLayout.HORIZONTAL);
                  top.setGravity(Gravity.CENTER_VERTICAL);

                  View indicator = new View(this);
                  indicator.setBackgroundColor(
                      s.url.equals(selectedServerUrl)
                          ? Color.rgb(35,205,95)
                          : Color.TRANSPARENT
                  );
                  top.addView(indicator, new LinearLayout.LayoutParams(dp(5), dp(38)));

                  TextView name = tv(s.name, 16, true);
                  name.setPadding(dp(12), 0, dp(8), 0);
                  top.addView(name, new LinearLayout.LayoutParams(0, dp(38), 1f));

                  card.addView(top, lp(-1, dp(38), 0, 0, 0, 6));

                  LinearLayout actions1 = new LinearLayout(this);
                  actions1.setOrientation(LinearLayout.HORIZONTAL);

                  Button load = smallButton("CARREGAR");
                  Button update = smallButton("ATUALIZAR");

                  LinearLayout.LayoutParams p1 = new LinearLayout.LayoutParams(0, dp(40), 1f);
                  p1.setMargins(0,0,dp(4),0);
                  actions1.addView(load, p1);

                  LinearLayout.LayoutParams p2 = new LinearLayout.LayoutParams(0, dp(40), 1f);
                  p2.setMargins(dp(4),0,0,0);
                  actions1.addView(update, p2);

                  card.addView(actions1, lp(-1, dp(40), 0, 0, 0, 6));

                  LinearLayout actions2 = new LinearLayout(this);
                  actions2.setOrientation(LinearLayout.HORIZONTAL);

                  Button clear = smallButton("LIMPAR CATÁLOGO");
                  Button del = smallButton("EXCLUIR");

                  LinearLayout.LayoutParams p3 = new LinearLayout.LayoutParams(0, dp(40), 1f);
                  p3.setMargins(0,0,dp(4),0);
                  actions2.addView(clear, p3);

                  LinearLayout.LayoutParams p4 = new LinearLayout.LayoutParams(0, dp(40), 1f);
                  p4.setMargins(dp(4),0,0,0);
                  actions2.addView(del, p4);

                  card.addView(actions2, lp(-1, dp(40), 0, 0, 0, 0));

                  load.setOnClickListener(v -> {
                      selectedServerUrl = s.url;
                      renderSavedServers();
                      loadServerBySaved(s, false);
                  });

                  update.setOnClickListener(v -> {
                      selectedServerUrl = s.url;
                      renderSavedServers();
                      loadServerBySaved(s, true);
                  });

                  clear.setOnClickListener(v -> confirmClearSavedServer(s));

                  del.setOnClickListener(v -> confirmDeleteServer(s));

                  parent.addView(card, lp(-1, -2, 0, 4, 0, 8));
              }

              Button smallButton(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextSize(11);
                  b.setAllCaps(false);
                  b.setTextColor(Color.WHITE);
                  b.setBackground(round(Color.rgb(34,112,210), dp(9)));
                  return b;
              }

              void loadServerBySaved(SavedServer s, boolean forceRefresh) {
                  selectedServerUrl = s.url;
                  updateActiveServerLabel(s.name);

                  if (!forceRefresh && loadCacheIfAvailable(s.url)) {
                      infoView.setText(all.size() + " conteúdos carregados do cache de " + s.name + ".");
                      return;
                  }

                  loadM3uFromUrl(s.url, forceRefresh, s.name);
              }

              void selectServer(SavedServer s) {
                  selectedServerUrl = s.url;
                  updateActiveServerLabel(s.name);
                  renderSavedServers();
                  loadServerBySaved(s, false);
              }

              void showAllServers() {
                  ArrayList<SavedServer> servers = getSavedServers();

                  if (servers.isEmpty()) {
                      toast("Nenhum servidor salvo.");
                      return;
                  }

                  ScrollView scroll = new ScrollView(this);
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(12), dp(8), dp(12), dp(12));
                  scroll.addView(box);

                  AlertDialog dlg = new AlertDialog.Builder(this)
                      .setTitle("Todos os servidores")
                      .setView(scroll)
                      .setNegativeButton("FECHAR", null)
                      .create();

                  for (SavedServer s : servers) {
                      LinearLayout card = new LinearLayout(this);
                      card.setOrientation(LinearLayout.VERTICAL);
                      card.setPadding(dp(10), dp(8), dp(10), dp(8));
                      card.setBackground(round(Color.rgb(240,240,240), dp(10)));

                      TextView name = tv(s.name, 16, true);
                      name.setTextColor(Color.BLACK);
                      card.addView(name, lp(-1,-2,0,0,0,6));

                      LinearLayout row1 = new LinearLayout(this);
                      row1.setOrientation(LinearLayout.HORIZONTAL);

                      Button load = new Button(this);
                      load.setText("CARREGAR");
                      load.setTextSize(11);

                      Button update = new Button(this);
                      update.setText("ATUALIZAR");
                      update.setTextSize(11);

                      LinearLayout.LayoutParams a = new LinearLayout.LayoutParams(0, dp(40), 1f);
                      a.setMargins(0,0,dp(4),0);
                      row1.addView(load, a);

                      LinearLayout.LayoutParams b = new LinearLayout.LayoutParams(0, dp(40), 1f);
                      b.setMargins(dp(4),0,0,0);
                      row1.addView(update, b);

                      card.addView(row1);

                      LinearLayout row2 = new LinearLayout(this);
                      row2.setOrientation(LinearLayout.HORIZONTAL);

                      Button clear = new Button(this);
                      clear.setText("LIMPAR CATÁLOGO");
                      clear.setTextSize(10);

                      Button del = new Button(this);
                      del.setText("EXCLUIR");
                      del.setTextSize(11);

                      LinearLayout.LayoutParams c = new LinearLayout.LayoutParams(0, dp(40), 1f);
                      c.setMargins(0,dp(4),dp(4),0);
                      row2.addView(clear, c);

                      LinearLayout.LayoutParams d = new LinearLayout.LayoutParams(0, dp(40), 1f);
                      d.setMargins(dp(4),dp(4),0,0);
                      row2.addView(del, d);

                      card.addView(row2);

                      load.setOnClickListener(v -> {
                          dlg.dismiss();
                          loadServerBySaved(s, false);
                      });

                      update.setOnClickListener(v -> {
                          dlg.dismiss();
                          loadServerBySaved(s, true);
                      });

                      clear.setOnClickListener(v -> {
                          dlg.dismiss();
                          confirmClearSavedServer(s);
                      });

                      del.setOnClickListener(v -> {
                          dlg.dismiss();
                          confirmDeleteServer(s);
                      });

                      box.addView(card, lp(-1,-2,0,4,0,8));
                  }

                  dlg.show();
              }

              void showManageServers() {
                  ArrayList<SavedServer> servers = getSavedServers();
                  if (servers.isEmpty()) {
                      toast("Nenhum servidor salvo.");
                      return;
                  }

                  ScrollView scroll = new ScrollView(this);
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(14), dp(8), dp(14), dp(8));
                  scroll.addView(box);

                  AlertDialog dlg = new AlertDialog.Builder(this)
                      .setTitle("Gerenciar servidores")
                      .setView(scroll)
                      .setNegativeButton("Fechar", null)
                      .create();

                  for (SavedServer s : servers) {
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setGravity(Gravity.CENTER_VERTICAL);
                      row.setPadding(dp(10), dp(6), dp(10), dp(6));

                      TextView name = tv(s.name, 15, true);
                      name.setTextColor(Color.BLACK);
                      LinearLayout.LayoutParams nameParams = new LinearLayout.LayoutParams(0, dp(44), 1f);
                      row.addView(name, nameParams);

                      Button open = new Button(this);
                      open.setText("ABRIR");
                      open.setTextSize(12);
                      LinearLayout.LayoutParams openParams = new LinearLayout.LayoutParams(dp(78), dp(42));
                      openParams.setMargins(dp(4),0,dp(4),0);
