                  showFilteredFirstItems();
              }

              boolean loadCacheIfAvailable(String raw) {
                  try {
                      File cache = new File(getFilesDir(), "catalog_" + hash(raw) + ".txt");
                      if (!cache.exists() || cache.length() == 0) return false;

                      ArrayList<Item> cached = new ArrayList<>();
                      BufferedReader br = new BufferedReader(
                          new InputStreamReader(new FileInputStream(cache), StandardCharsets.UTF_8), 65536
                      );

                      String line;
                      while ((line = br.readLine()) != null) {
                          String[] p = line.split("\\|\\|\\|", -1);
                          if (p.length >= 4) {
                              cached.add(new Item(
                                  fromCache(p[0]),
                                  fromCache(p[1]),
                                  fromCache(p[2]),
                                  p[3]
                              ));
                          }
                      }
                      br.close();

                      all.clear();
                      all.addAll(cached);
                      updateCounters();
                      searchBox.setEnabled(true);
                      showFirstItems();
                      infoView.setText(all.size() + " conteúdos carregados do cache.");
                      return true;

                  } catch (Exception e) {
                      return false;
                  }
              }

              String hash(String s) {
                  try {
                      MessageDigest md = MessageDigest.getInstance("SHA-256");
                      byte[] b = md.digest(s.getBytes(StandardCharsets.UTF_8));
                      StringBuilder sb = new StringBuilder();
                      for (byte x : b) sb.append(String.format("%02x", x));
                      return sb.toString().substring(0, 24);
                  } catch (Exception e) {
                      return Integer.toHexString(s.hashCode());
                  }
              }

              String toCache(String s) {
                  return s.replace("\\", "%5C").replace("|", "%7C").replace("\n", "%0A").replace("\r", "%0D");
              }

              String fromCache(String s) {
                  return s.replace("%0D", "\r").replace("%0A", "\n").replace("%7C", "|").replace("%5C", "\\");
              }

              void copyFile(File src, File dst) throws IOException {
                  InputStream in = new FileInputStream(src);
                  OutputStream out = new FileOutputStream(dst);
                  byte[] buf = new byte[65536];
                  int n;
                  while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                  in.close();
                  out.close();
              }

              String attr(String s, String key) {
                  Matcher m = Pattern.compile(
                      key + "=\"([^\"]*)\"",
                      Pattern.CASE_INSENSITIVE
                  ).matcher(s);

                  return m.find() ? m.group(1).trim() : "";
              }

              String classify(String name, String group, String url) {
                  String s = (name + " " + group + " " + url).toLowerCase(Locale.ROOT);

                  if (s.contains("series") ||
                      s.contains("série") ||
                      s.contains("serie") ||
                      s.contains("/series/") ||
                      s.contains("temporada") ||
                      s.contains("season")) {
                      return "SÉRIE";
                  }

                  if (s.contains("movie") ||
                      s.contains("filme") ||
                      s.contains("/movie/") ||
                      s.endsWith(".mp4") ||
                      s.endsWith(".mkv") ||
                      s.endsWith(".avi")) {
                      return "FILME";
                  }

                  return "CANAL";
              }

              void updateCounters() {
                  int c = 0;
                  int m = 0;
                  int s = 0;

                  for (Item i : all) {
                      if (i.type.equals("CANAL")) c++;
                      else if (i.type.equals("FILME")) m++;
                      else s++;
                  }

                  totalView.setText("TOTAL\n" + all.size());
                  channelView.setText("CANAIS\n" + c);
                  movieView.setText("FILMES\n" + m);
                  seriesView.setText("SÉRIES\n" + s);
                  updateCardVisuals();
              }

              void scheduleSearch(String q) {
                  if (activeFilter.equals("SÉRIES")) {
                      if (pendingSearch != null) ui.removeCallbacks(pendingSearch);
                      final String query = q == null ? "" : q.trim();
                      pendingSearch = () -> showSeriesGroups(query);
                      ui.postDelayed(pendingSearch, 220);
                      return;
                  }

                  if (pendingSearch != null) {
                      ui.removeCallbacks(pendingSearch);
                  }

                  final String query = q == null ? "" : q.trim();
                  final int version = searchVersion.incrementAndGet();

                  if (query.isEmpty()) {
                      showFilteredFirstItems();
                      infoView.setText(all.size() + " conteúdos carregados.");
                      return;
                  }

                  pendingSearch = () -> runSearchAsync(query, version);
                  ui.postDelayed(pendingSearch, 220);
              }

              void runSearchAsync(String q, int version) {
                  final String x = q.toLowerCase(Locale.ROOT);

                  new Thread(() -> {
                      ArrayList<Item> results = new ArrayList<>();
                      ArrayList<String> rows = new ArrayList<>();

                      for (Item i : all) {
                          if (version != searchVersion.get()) {
                              return;
                          }

                          if (matchesActiveFilter(i) && i.searchKey.contains(x)) {
                              results.add(i);

                              String group = i.group.isEmpty() ? "Sem categoria" : i.group;
                              rows.add(
                                  i.name + "\n" +
                                  i.type + " • " +
                                  group + " • " +
                                  i.status
                              );

                              if (results.size() >= MAX_RESULTS) {
                                  break;
                              }
                          }
                      }

                      ui.post(() -> {
                          if (version != searchVersion.get()) {
                              return;
                          }

                          shown.clear();
                          shown.addAll(results);

                          adapter.clear();
                          adapter.addAll(rows);
                          adapter.notifyDataSetChanged();

                          if (results.size() >= MAX_RESULTS) {
                              infoView.setText(
                                  "Mostrando os primeiros " +
                                  MAX_RESULTS +
                                  " resultados. Digite mais letras para refinar."
                              );
                          } else {
                              infoView.setText(results.size() + " resultado(s) encontrado(s).");
                          }

                          list.setSelection(0);
                      });
                  }).start();
              }

              void refreshCurrentResults() {
                  String q = searchBox.getText().toString().trim();
                  if (!q.isEmpty()) {
                      scheduleSearch(q);
                  }
              }

              void showItemDialog(Item item) {
                  LinearLayout outer = new LinearLayout(this);
                  outer.setOrientation(LinearLayout.VERTICAL);
                  outer.setPadding(dp(18), dp(18), dp(18), dp(8));
                  outer.setBackground(round(Color.rgb(18,22,30), dp(16)));

                  TextView name = tv(item.name, 21, true);
                  name.setTextColor(Color.WHITE);
                  outer.addView(name);

                  TextView details = tv(
                      item.type + " • " + (item.group.isEmpty() ? "Sem categoria" : item.group),
                      14,
                      false
                  );
                  details.setTextColor(Color.rgb(185, 195, 205));
                  outer.addView(details, lp(-1, -2, 0, 8, 0, 14));

                  TextView statusLabel = tv("STATUS DO CONTEÚDO", 12, true);
                  statusLabel.setTextColor(Color.rgb(140, 150, 160));
                  outer.addView(statusLabel, lp(-1, -2, 0, 0, 0, 8));

                  TextView status = tv(item.status, 15, true);
                  status.setTextColor(Color.WHITE);
                  status.setGravity(Gravity.CENTER);
                  status.setPadding(dp(14), dp(10), dp(14), dp(10));
                  status.setBackground(round(statusBgColor(item.status), dp(12)));
                  outer.addView(status, lp(-1, -2, 0, 0, 0, 6));

                  AlertDialog dlg = new AlertDialog.Builder(this)
                      .setView(outer)
                      .setNegativeButton("FECHAR", null)
                      .setPositiveButton("TESTAR AGORA", null)
                      .create();

                  dlg.setOnShowListener(x -> {
                      if (dlg.getWindow() != null) {
                          dlg.getWindow().setBackgroundDrawable(round(Color.rgb(18,22,30), dp(18)));
                      }

                      Button closeBtn = dlg.getButton(AlertDialog.BUTTON_NEGATIVE);
                      Button testBtn = dlg.getButton(AlertDialog.BUTTON_POSITIVE);

                      closeBtn.setTextColor(Color.rgb(170, 180, 190));
                      testBtn.setTextColor(Color.rgb(82, 163, 255));

                      testBtn.setOnClickListener(v -> {
                          status.setText("TESTANDO...");
                          status.setTextColor(Color.WHITE);
                          status.setBackground(round(statusBgColor("TESTANDO..."), dp(12)));
                          testItem(item, status);
                      });
                  });

                  dlg.show();
              }

              int statusBgColor(String s) {
                  if (s.equals("FUNCIONANDO")) return Color.rgb(18, 125, 68);
                  if (s.equals("LENTO")) return Color.rgb(196, 122, 0);
                  if (s.equals("FORA DO AR")) return Color.rgb(185, 36, 36);
                  if (s.equals("TESTANDO...")) return Color.rgb(42, 97, 168);
                  return Color.rgb(80, 88, 96);
              }

              int statusColor(String s) {
                  if (s.equals("FUNCIONANDO")) return Color.rgb(0,150,70);
                  if (s.equals("LENTO")) return Color.rgb(220,140,0);
                  if (s.equals("FORA DO AR")) return Color.rgb(200,30,40);
                  return Color.DKGRAY;
              }

              void testItem(Item item, TextView statusView) {
                  new Thread(() -> {
                      long start = System.currentTimeMillis();
                      String result = "FORA DO AR";
                      HttpURLConnection c = null;

                      try {
                          c = (HttpURLConnection)new URL(item.url).openConnection();
                          c.setInstanceFollowRedirects(true);
                          c.setConnectTimeout(8000);
                          c.setReadTimeout(8000);
                          c.setRequestProperty("User-Agent","BiggerCatalogo/13.0");
                          c.setRequestProperty("Range","bytes=0-2048");
                          c.setRequestMethod("GET");

                          int code = c.getResponseCode();
                          InputStream in = (code >= 200 && code < 400) ? c.getInputStream() : null;

                          if (in != null) {
                              byte[] b = new byte[256];
                              int n = in.read(b);
                              in.close();

                              if (n >= 0) {
                                  long ms = System.currentTimeMillis() - start;
                                  result = ms > 4500 ? "LENTO" : "FUNCIONANDO";
                              }
                          }

                      } catch (Exception ignored) {
                          result = "FORA DO AR";

                      } finally {
                          if (c != null) c.disconnect();
                      }

                      final String r = result;

                      ui.post(() -> {
                          item.status = r;
                          statusView.setText(r);
                          statusView.setTextColor(Color.WHITE);
                          statusView.setBackground(round(statusBgColor(r), dp(12)));
                          refreshCurrentResults();
                      });
                  }).start();
              }

              void toast(String s) {
                  Toast.makeText(this, s, Toast.LENGTH_SHORT).show();
              }
          }
          EOF

      - name: Compilar APK Debug
        shell: bash
        run: |
          set -e
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Preparar APK
        shell: bash
        run: |
          set -e
          mkdir -p saida
          cp app/build/outputs/apk/debug/app-debug.apk "saida/Bigger-Catalogo-M3U-v13.apk"
          ls -lh saida/

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Bigger-Catalogo-M3U-v13-APK
          path: saida/Bigger-Catalogo-M3U-v13.apk
          if-no-files-found: error
