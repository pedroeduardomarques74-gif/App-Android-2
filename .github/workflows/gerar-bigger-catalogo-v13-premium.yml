              void deleteCacheForUrl(String raw) {
                  try {
                      File f1 = new File(getFilesDir(), "catalog_" + hash(raw) + ".txt");
                      File f2 = new File(getCacheDir(), "catalog_" + hash(raw) + ".tmp");
                      if (f1.exists()) f1.delete();
                      if (f2.exists()) f2.delete();
                  } catch (Exception ignored) {}
              }

              void deleteAllCatalogCaches() {
                  try {
                      File[] files = getFilesDir().listFiles();
                      if (files != null) {
                          for (File f : files) {
                              if (f.getName().startsWith("catalog_") && f.getName().endsWith(".txt")) {
                                  f.delete();
                              }
                          }
                      }

                      File[] cacheFiles = getCacheDir().listFiles();
                      if (cacheFiles != null) {
                          for (File f : cacheFiles) {
                              if (f.getName().startsWith("catalog_") && f.getName().endsWith(".tmp")) {
                                  f.delete();
                              }
                          }
                      }
                  } catch (Exception ignored) {}
              }

