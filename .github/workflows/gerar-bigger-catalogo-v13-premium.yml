              void loadM3u(boolean forceRefresh) {
                  String raw = urlBox.getText().toString().trim();

                  if (!(raw.startsWith("http://") || raw.startsWith("https://"))) {
                      toast("Cole um link M3U válido.");
                      return;
                  }

                  loadM3uFromUrl(raw, forceRefresh, serverNameBox == null ? "" : serverNameBox.getText().toString().trim());
              }

              void loadM3uFromUrl(String raw, boolean forceRefresh, String serverLabel) {
                  if (!forceRefresh && loadCacheIfAvailable(raw)) {
                      infoView.setText(all.size() + " conteúdos carregados do cache.");
                      return;
                  }

                  infoView.setText("Conectando ao servidor " + (serverLabel.isEmpty() ? "" : serverLabel + "..."));

                  all.clear();
                  shown.clear();
                  shownSeries.clear();
                  adapter.clear();
                  adapter.notifyDataSetChanged();
                  updateCounters();

                  new Thread(() -> {
                      File cacheTmp = new File(getCacheDir(), "catalog_" + hash(raw) + ".tmp");
                      File cacheFinal = new File(getFilesDir(), "catalog_" + hash(raw) + ".txt");

                      try {
                          HttpURLConnection c = (HttpURLConnection)new URL(raw).openConnection();
                          c.setConnectTimeout(12000);
                          c.setReadTimeout(45000);
                          c.setRequestProperty("User-Agent","BiggerCatalogo/13.0");

                          int code = c.getResponseCode();
                          if (code < 200 || code >= 400) throw new IOException("HTTP " + code);

                          BufferedReader br = new BufferedReader(
                              new InputStreamReader(c.getInputStream(), StandardCharsets.UTF_8), 65536
                          );

                          BufferedWriter cacheWriter = new BufferedWriter(
                              new OutputStreamWriter(new FileOutputStream(cacheTmp), StandardCharsets.UTF_8), 65536
                          );

                          ArrayList<Item> batch = new ArrayList<>();
                          String line;
                          String meta = null;
                          int parsedCount = 0;

                          while ((line = br.readLine()) != null) {
                              line = line.trim();

                              if (line.startsWith("#EXTINF")) {
                                  meta = line;
                              } else if (meta != null && !line.isEmpty() && !line.startsWith("#")) {
                                  String name = attr(meta, "tvg-name");

                                  if (name.isEmpty()) {
                                      int comma = meta.lastIndexOf(',');
                                      name = comma >= 0 ? meta.substring(comma + 1).trim() : "Sem nome";
                                  }

                                  String group = attr(meta, "group-title");
                                  String type = classify(name, group, line);
                                  Item item = new Item(name, group, line, type);
                                  batch.add(item);

                                  cacheWriter.write(toCache(name));
                                  cacheWriter.write("|||");
                                  cacheWriter.write(toCache(group));
                                  cacheWriter.write("|||");
                                  cacheWriter.write(toCache(line));
                                  cacheWriter.write("|||");
                                  cacheWriter.write(type);
                                  cacheWriter.newLine();

                                  parsedCount++;

                                  if (batch.size() >= 300) {
                                      ArrayList<Item> send = new ArrayList<>(batch);
                                      batch.clear();
                                      int progress = parsedCount;

                                      ui.post(() -> {
                                          all.addAll(send);
                                          updateCounters();
                                          searchBox.setEnabled(true);

                                          String current = searchBox.getText().toString().trim();
                                          if (current.isEmpty()) {
                                              showFirstItems();
                                          } else {
                                              scheduleSearch(current);
                                          }

                                          infoView.setText(progress + " conteúdos recebidos... carregando em blocos");
                                      });
                                  }

                                  meta = null;
                              }
                          }

                          if (!batch.isEmpty()) {
                              ArrayList<Item> send = new ArrayList<>(batch);
                              ui.post(() -> {
                                  all.addAll(send);
                                  updateCounters();
                                  searchBox.setEnabled(true);

                                  String current = searchBox.getText().toString().trim();
                                  if (current.isEmpty()) showFirstItems();
                                  else scheduleSearch(current);
                              });
                          }

                          br.close();
                          cacheWriter.flush();
                          cacheWriter.close();

                          if (cacheFinal.exists()) cacheFinal.delete();

                          if (!cacheTmp.renameTo(cacheFinal)) {
                              copyFile(cacheTmp, cacheFinal);
                              cacheTmp.delete();
                          }

                          ui.post(() -> {
                              searchBox.setEnabled(true);
                              infoView.setText(all.size() + " conteúdos carregados. Catálogo salvo no aparelho.");
                          });

                      } catch (Exception e) {
                          ui.post(() -> {
                              infoView.setText("Falha ao carregar: " + e.getMessage());
                              toast("Não foi possível carregar essa lista.");
                          });
                      }
                  }).start();
              }

