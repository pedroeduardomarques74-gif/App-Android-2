              String normalizeSeriesTitle(String name) {
                  String s = name.trim();

                  s = s.replaceAll("(?i)[\\\\s._-]+S\\\\d{1,2}[\\\\s._-]*E\\\\d{1,3}.*$", "");
                  s = s.replaceAll("(?i)[\\\\s._-]+T\\\\d{1,2}[\\\\s._-]*E\\\\d{1,3}.*$", "");
                  s = s.replaceAll("(?i)[\\\\s._-]+Temporada\\\\s*\\\\d{1,2}.*$", "");
                  s = s.replaceAll("(?i)[\\\\s._-]+Season\\\\s*\\\\d{1,2}.*$", "");
                  s = s.replaceAll("(?i)[\\\\s._-]+Epis[oó]dio\\\\s*\\\\d{1,3}.*$", "");
                  s = s.replaceAll("(?i)[\\\\s._-]+EP\\\\s*\\\\d{1,3}.*$", "");
                  s = s.replaceAll("(?i)[\\\\s._-]+\\\\d{1,2}x\\\\d{1,3}.*$", "");
                  s = s.replaceAll("[\\\\s._-]+$", "").trim();

                  return s.isEmpty() ? name.trim() : s;
              }

              int parseSeason(String name) {
                  Matcher[] tests = new Matcher[]{
                      Pattern.compile("(?i)S(\\\\d{1,2})E\\\\d{1,3}").matcher(name),
                      Pattern.compile("(?i)T(\\\\d{1,2})E\\\\d{1,3}").matcher(name),
                      Pattern.compile("(?i)Temporada\\\\s*(\\\\d{1,2})").matcher(name),
                      Pattern.compile("(?i)Season\\\\s*(\\\\d{1,2})").matcher(name),
                      Pattern.compile("(?i)(\\\\d{1,2})x\\\\d{1,3}").matcher(name)
                  };
                  for (Matcher m : tests) {
                      if (m.find()) {
                          try { return Integer.parseInt(m.group(1)); } catch (Exception ignored) {}
                      }
                  }
                  return 1;
              }

              int parseEpisode(String name) {
                  Matcher[] tests = new Matcher[]{
                      Pattern.compile("(?i)S\\\\d{1,2}E(\\\\d{1,3})").matcher(name),
                      Pattern.compile("(?i)T\\\\d{1,2}E(\\\\d{1,3})").matcher(name),
                      Pattern.compile("(?i)Epis[oó]dio\\\\s*(\\\\d{1,3})").matcher(name),
                      Pattern.compile("(?i)EP\\\\s*(\\\\d{1,3})").matcher(name),
                      Pattern.compile("(?i)\\\\d{1,2}x(\\\\d{1,3})").matcher(name)
                  };
                  for (Matcher m : tests) {
                      if (m.find()) {
                          try { return Integer.parseInt(m.group(1)); } catch (Exception ignored) {}
                      }
                  }
                  return 0;
              }

              void showSeriesGroups(String query) {
                  final String q = query == null ? "" : query.trim().toLowerCase(Locale.ROOT);
                  final int version = searchVersion.incrementAndGet();

                  new Thread(() -> {
                      LinkedHashMap<String, SeriesGroup> map = new LinkedHashMap<>();

                      for (Item i : all) {
                          if (version != searchVersion.get()) return;
                          if (!i.type.equals("SÉRIE")) continue;

                          String title = normalizeSeriesTitle(i.name);
                          if (!q.isEmpty() && !title.toLowerCase(Locale.ROOT).contains(q) &&
                              !i.name.toLowerCase(Locale.ROOT).contains(q)) {
                              continue;
                          }

                          String key = title.toLowerCase(Locale.ROOT);
                          SeriesGroup sg = map.get(key);
                          if (sg == null) {
                              sg = new SeriesGroup(title);
                              map.put(key, sg);
                          }

                          sg.episodes.add(i);
                          int season = parseSeason(i.name);
                          ArrayList<Item> eps = sg.seasons.get(season);
                          if (eps == null) {
                              eps = new ArrayList<>();
                              sg.seasons.put(season, eps);
                          }
                          eps.add(i);
                      }

                      ArrayList<SeriesGroup> groups = new ArrayList<>(map.values());
                      groups.sort((a,b) -> a.title.compareToIgnoreCase(b.title));

                      if (groups.size() > MAX_RESULTS) {
                          groups = new ArrayList<>(groups.subList(0, MAX_RESULTS));
                      }

                      ArrayList<String> rows = new ArrayList<>();
                      for (SeriesGroup sg : groups) {
                          rows.add(
                              sg.title + "\n" +
                              sg.seasons.size() + " temporada(s) • " +
                              sg.episodes.size() + " episódio(s)"
                          );
                      }

                      ArrayList<SeriesGroup> finalGroups = groups;
                      ui.post(() -> {
                          if (version != searchVersion.get()) return;
                          shown.clear();
                          shownSeries.clear();
                          shownSeries.addAll(finalGroups);

                          adapter.clear();
                          adapter.addAll(rows);
                          adapter.notifyDataSetChanged();
                          list.setSelection(0);

                          if (finalGroups.size() >= MAX_RESULTS) {
                              infoView.setText("Mostrando as primeiras " + MAX_RESULTS + " séries. Digite para refinar.");
                          } else {
                              infoView.setText(finalGroups.size() + " série(s) encontrada(s).");
                          }
                      });
                  }).start();
              }

