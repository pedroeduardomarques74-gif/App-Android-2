name: Gerar APK - Bigger Catalogo M3U

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK Debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar APK
        run: |
          mkdir -p apk-saida
          cp app/build/outputs/apk/debug/app-debug.apk apk-saida/Bigger-Catalogo-M3U-v1.apk

      - name: Enviar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Bigger-Catalogo-M3U-APK
          path: apk-saida/Bigger-Catalogo-M3U-v1.apk
          if-no-files-found: error
          retention-days: 30
