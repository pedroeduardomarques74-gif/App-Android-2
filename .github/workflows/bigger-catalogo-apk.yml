name: Gerar APK - Red Play URL Login

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK Debug
        working-directory: url-login-player
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar APK
        run: |
          mkdir -p apk-saida
          cp url-login-player/app/build/outputs/apk/debug/app-debug.apk apk-saida/Red-Play-URL-Login.apk

      - name: Enviar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Red-Play-URL-Login-APK
          path: apk-saida/Red-Play-URL-Login.apk
          if-no-files-found: error
          retention-days: 30
