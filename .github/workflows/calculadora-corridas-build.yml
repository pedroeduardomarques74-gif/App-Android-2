name: Calculadora Corridas APK - v1.2
on:
  push:
    branches: [ "calculadora-corridas-v12" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar projeto base
        run: |
          rm -rf build_project ui_overlay v12_overlay
          mkdir build_project ui_overlay v12_overlay
          cat calcpart_00 calcpart_01 calcpart_02 calcpart_03 calcpart_04 calcpart_05 calcpart_06 > calculadora_project.zip.b64
          base64 -d calculadora_project.zip.b64 > project.zip
          unzip -q project.zip -d build_project
          echo "PROJECT_DIR=$(find build_project -mindepth 1 -maxdepth 1 -type d | head -1)" >> "$GITHUB_ENV"

      - name: Aplicar correções visuais v1.1
        run: |
          base64 -d ui_overlay.zip.b64 > ui_overlay.zip
          unzip -q ui_overlay.zip -d ui_overlay
          cp -R ui_overlay/app/. "$PROJECT_DIR/app/"
          cp ui_overlay/patch_ui.py "$PROJECT_DIR/patch_ui.py"
          cd "$PROJECT_DIR"
          python3 patch_ui.py

      - name: Aplicar melhorias v1.2
        run: |
          base64 -d v12_overlay.zip.b64 > v12_overlay.zip
          unzip -q v12_overlay.zip -d v12_overlay
          cp -R v12_overlay/app/. "$PROJECT_DIR/app/"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Testes
        run: |
          cd "$PROJECT_DIR"
          gradle testDebugUnitTest --stacktrace

      - name: Gerar APK v1.2
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Coletar APK
        run: |
          mkdir -p apk-out
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" apk-out/Calculadora-Corridas-v1.2.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Calculadora-Corridas-v1.2
          path: apk-out/Calculadora-Corridas-v1.2.apk

      - name: Exportar fonte aplicado
        uses: actions/upload-artifact@v4
        with:
          name: Calculadora-Corridas-v1.2-source
          path: ${{ env.PROJECT_DIR }}
