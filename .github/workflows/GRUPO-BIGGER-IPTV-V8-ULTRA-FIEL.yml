name: Gerar APK - Grupo Bigger IPTV V8 Ultra Fiel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Criar projeto V8 Ultra Fiel
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/projeto.zip
          unzip -q /tmp/projeto.zip -d /tmp/projeto
          mv /tmp/projeto/GrupoBiggerIPTV-v8-UNIT-STYLE ./app-projeto

      - name: Compilar APK Debug
        working-directory: app-projeto
        run: gradle assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Grupo-Bigger-IPTV-V8-Ultra-Fiel-APK
          path: app-projeto/app/build/outputs/apk/debug/*.apk
