name: BIGGER TESTE v51 Trava Scroll Servidores

on:
  push:
    paths:
      - '.github/workflows/build-bigger-teste-v51-scroll-servidores-mensagens.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android 35
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Recuperar projeto v43
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          s=Path('.github/workflows/build-apk-leve-v43-texto-completo-corrigido.yml').read_text(encoding='utf-8')
          m=re.search(r"printf '%s' '([^']+)' \| base64 -d > projeto\.zip",s)
          if not m:
              raise SystemExit('Payload do projeto v43 nao encontrado')
          Path('projeto.zip').write_bytes(base64.b64decode(m.group(1)))
          PY
          unzip -q projeto.zip
          cp -a GeradorTesteIPTV-Ultra/. .

      - name: Aplicar melhorias v49
        run: patch -p0 < bigger-teste-v49.patch

      - name: Aplicar trava exclusiva na rolagem dos servidores
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('app/src/main/java/com/grupobigger/geradorteste/MainActivity.java')
          s=p.read_text(encoding='utf-8')

          old='ScrollView scopesScroll=new ScrollView(this);scopesScroll.addView(scopesBox);scopesScroll.setVerticalScrollBarEnabled(true);scopesScroll.setOnTouchListener(nestedScrollLock());LinearLayout.LayoutParams slp=new LinearLayout.LayoutParams(-1,servers.length()>4?dp(4*38):ViewGroup.LayoutParams.WRAP_CONTENT);l.addView(scopesScroll,slp);'
          new='ScrollView scopesScroll=new ScrollView(this);scopesScroll.addView(scopesBox);scopesScroll.setVerticalScrollBarEnabled(true);scopesScroll.setScrollbarFadingEnabled(false);scopesScroll.setNestedScrollingEnabled(false);scopesScroll.setOnTouchListener((v,e)->{ViewParent parent=v.getParent();if(parent!=null)parent.requestDisallowInterceptTouchEvent(true);int a=e.getActionMasked();if((a==MotionEvent.ACTION_UP||a==MotionEvent.ACTION_CANCEL)&&parent!=null)parent.requestDisallowInterceptTouchEvent(false);return false;});LinearLayout.LayoutParams slp=new LinearLayout.LayoutParams(-1,servers.length()>4?dp(4*38):ViewGroup.LayoutParams.WRAP_CONTENT);l.addView(scopesScroll,slp);'

          if old not in s:
              raise SystemExit('Linha exata da lista de servidores nao encontrada')
          s=s.replace(old,new,1)
          s=s.replace('build-bigger-teste-v49-variaveis-massa-horas.yml','build-bigger-teste-v51-scroll-servidores-mensagens.yml')

          p.write_text(s,encoding='utf-8')

          g=Path('app/build.gradle')
          gs=g.read_text(encoding='utf-8')
          gs=gs.replace("applicationId 'com.grupobigger.geradorteste.v49'","applicationId 'com.grupobigger.geradorteste.v51'")
          gs=re.sub(r'versionCode\s+43\b','versionCode 51',gs)
          g.write_text(gs,encoding='utf-8')

          print('Scroll interno dos servidores corrigido com bloqueio do scroll externo.')
          PY

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BIGGER-TESTE-v51-TRAVA-SCROLL-SERVIDORES.apk

      - name: Enviar APK pronto
        uses: actions/upload-artifact@v4
        with:
          name: BIGGER-TESTE-v51-TRAVA-SCROLL-SERVIDORES
          path: BIGGER-TESTE-v51-TRAVA-SCROLL-SERVIDORES.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK no repositorio
        shell: bash
        run: |
          mkdir -p builds
          cp BIGGER-TESTE-v51-TRAVA-SCROLL-SERVIDORES.apk builds/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/BIGGER-TESTE-v51-TRAVA-SCROLL-SERVIDORES.apk
          git commit -m "build: APK v51 trava scroll servidores" || exit 0
          git push
