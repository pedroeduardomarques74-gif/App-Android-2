name: Gerar APK - Grupo Bigger IPTV V2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar raiz do projeto
        id: project
        shell: bash
        run: |
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            PROJECT_DIR="."
          elif [ -f "GrupoBiggerIPTV-v2/settings.gradle.kts" ] || [ -f "GrupoBiggerIPTV-v2/settings.gradle" ]; then
            PROJECT_DIR="GrupoBiggerIPTV-v2"
          else
            SETTINGS_FILE="$(find . -maxdepth 4 -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)"
            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERRO: settings.gradle(.kts) não encontrado."
              echo "Arquivos encontrados no repositório:"
              find . -maxdepth 3 -type f | sort | head -n 300
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          echo "Projeto localizado em: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verificar estrutura Android
        shell: bash
        run: |
          cd "${{ steps.project.outputs.dir }}"
          test -f app/build.gradle.kts -o -f app/build.gradle || {
            echo "ERRO: módulo app não encontrado em $(pwd)"
            find . -maxdepth 3 -type f | sort
            exit 1
          }
          echo "Estrutura OK"
          ls -la
          ls -la app

      - name: Compilar APK Debug
        shell: bash
        run: |
          cd "${{ steps.project.outputs.dir }}"
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon :app:assembleDebug --stacktrace
          else
            gradle --no-daemon :app:assembleDebug --stacktrace
          fi

      - name: Preparar APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não encontrado após a compilação."
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/Grupo-Bigger-IPTV-v2.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Grupo-Bigger-IPTV-v2
          path: Grupo-Bigger-IPTV-v2.apk
          if-no-files-found: error
          retention-days: 30
