name: BIGGER TESTE v49 Variaveis Massa Horas

on:
  push:
    paths:
      - '.github/workflows/build-bigger-teste-v49-variaveis-massa-horas.yml'
      - 'bigger-teste-v49.patch'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android 35
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Recuperar projeto v43
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          s=Path('.github/workflows/build-apk-leve-v43-texto-completo-corrigido.yml').read_text(encoding='utf-8')
          m=re.search(r"printf '%s' '([A-Za-z0-9+/=]+)' \| base64 -d > projeto\.zip",s)
          if not m:
              raise SystemExit('Payload do projeto v43 nao encontrado')
          Path('projeto.zip').write_bytes(base64.b64decode(m.group(1)))
          PY
          unzip -q projeto.zip
          cp -a GeradorTesteIPTV-Ultra/. .

      - name: Aplicar melhorias v49
        run: patch -p0 < bigger-teste-v49.patch

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BIGGER-TESTE-v49-VARIAVEIS-MASSA-HORAS.apk

      - name: Enviar APK pronto
        uses: actions/upload-artifact@v4
        with:
          name: BIGGER-TESTE-v49-VARIAVEIS-MASSA-HORAS
          path: BIGGER-TESTE-v49-VARIAVEIS-MASSA-HORAS.apk
          if-no-files-found: error
          retention-days: 30
