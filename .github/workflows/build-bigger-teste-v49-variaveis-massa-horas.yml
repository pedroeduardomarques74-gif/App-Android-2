name: BIGGER TESTE v49 - Variaveis em Massa + Horas

on:
  push:
    paths:
      - '.github/workflows/build-bigger-teste-v49-variaveis-massa-horas.yml'
  workflow_dispatch:
    inputs:
      config_gzip_base64:
        description: 'Configuracao compactada embutida (uso automatico pelo app)'
        required: false
        default: ''
      config_base64:
        description: 'Configuracao antiga sem compactacao (compatibilidade)'
        required: false
        default: ''
      build_id:
        description: 'ID do APK configurado'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Recuperar projeto v43
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          s=Path('.github/workflows/build-apk-leve-v43-texto-completo-corrigido.yml').read_text(encoding='utf-8')
          m=re.search(r"printf '%s' '([A-Za-z0-9+/=]+)' \| base64 -d > projeto\.zip",s)
          if not m: raise SystemExit('Payload v43 nao encontrado')
          Path('projeto.zip').write_bytes(base64.b64decode(m.group(1)))
          PY
          unzip -q projeto.zip
          cp -a GeradorTesteIPTV-Ultra/. .

