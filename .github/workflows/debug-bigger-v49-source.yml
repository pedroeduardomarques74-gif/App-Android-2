name: DEBUG BIGGER v49 SOURCE
on:
  push:
    paths:
      - '.github/workflows/debug-bigger-v49-source.yml'
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar projeto v43
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          s=Path('.github/workflows/build-apk-leve-v43-texto-completo-corrigido.yml').read_text(encoding='utf-8')
          m=re.search(r"printf '%s' '([A-Za-z0-9+/=]+)' \\| base64 -d > projeto\\.zip",s)
          if not m:
              raise SystemExit('Payload do projeto v43 nao encontrado')
          Path('projeto.zip').write_bytes(base64.b64decode(m.group(1)))
          PY
          unzip -q projeto.zip
          cp -a GeradorTesteIPTV-Ultra/. .
      - name: Aplicar v49
        run: patch -p0 < bigger-teste-v49.patch
      - name: Extrair trecho da tela de mensagens
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/grupobigger/geradorteste/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          keys=['MOSTRAR ESTA MENSAGEM EM','Adicionar uma mensagem','Adicionar mensagem']
          idx=-1
          for k in keys:
              idx=s.find(k)
              if idx>=0: break
          if idx<0:
              raise SystemExit('Tela de mensagem nao encontrada')
          a=max(0,idx-7000); b=min(len(s),idx+12000)
          Path('trecho-mensagem.txt').write_text(s[a:b],encoding='utf-8')
          PY
      - name: Publicar trecho para diagnostico
        shell: bash
        run: |
          mkdir -p debug
          cp trecho-mensagem.txt debug/trecho-mensagem-v49.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/trecho-mensagem-v49.txt
          git commit -m "debug: trecho tela mensagens v49" || exit 0
          git push
