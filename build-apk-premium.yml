name: Gerar APK Android Premium

on:
  workflow_dispatch:
  push:
    branches: [ "principal" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Criar projeto Android Premium
        shell: bash
        run: |
          rm -rf app settings.gradle build.gradle
          mkdir -p app/src/main/java/com/grupobigger/geradorteste
          mkdir -p app/src/main/res/values
          echo '' | base64 -d > settings.gradle
          echo 'cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguNy4zJyBhcHBseSBmYWxzZQp9Cg==' | base64 -d > build.gradle
          echo '' | base64 -d > app/build.gradle
          echo '' | base64 -d > app/src/main/AndroidManifest.xml
          echo '' | base64 -d > app/src/main/res/values/styles.xml
          echo '' | base64 -d > app/src/main/java/com/grupobigger/geradorteste/MainActivity.java

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GeradorTesteIPTV-Premium.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: GeradorTesteIPTV-Premium-APK
          path: GeradorTesteIPTV-Premium.apk
