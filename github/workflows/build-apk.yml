name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Criar projeto do app
        shell: bash
        run: |
          echo '' | base64 -d > projeto.zip
          unzip -q projeto.zip
          cp -r GeradorTesteIPTV/. .
          rm -rf GeradorTesteIPTV projeto.zip

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GeradorTesteIPTV.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: GeradorTesteIPTV-APK
          path: GeradorTesteIPTV.apkw
